<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PokéPreço</title>
<style>
  :root { --bg:#0f1220; --card:#1a1f35; --fg:#eef; --muted:#99a; --acc:#ffcb05; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,sans-serif; background:var(--bg); color:var(--fg); }
  main { max-width:480px; margin:auto; padding:16px; }
  h1 { color:var(--acc); margin:8px 0 16px; }
  button, input { font:inherit; border-radius:12px; border:0; padding:14px; width:100%; }
  button { background:var(--acc); color:#222; font-weight:700; margin-top:8px; }
  button.sec { background:var(--card); color:var(--fg); }
  input[type=text] { background:var(--card); color:var(--fg); }
  #status { color:var(--muted); min-height:1.5em; margin:12px 0; }
  #debug { color:var(--muted); font-size:12px; white-space:pre-wrap; }
  #shot { display:block; max-width:160px; border-radius:8px; margin:8px auto; }
  .res { display:flex; gap:12px; background:var(--card); border-radius:12px; padding:10px; margin-top:10px; }
  .res img { width:110px; border-radius:6px; }
  .res small { color:var(--muted); }
  .price { margin:4px 0; }
  .price b { color:var(--acc); }
  dialog { width:100%; max-width:100%; height:100%; max-height:100%; margin:0; padding:0; border:0; background:var(--bg); color:var(--fg); }
  dialog header { display:flex; gap:8px; padding:8px; }
  dialog iframe { width:100%; height:calc(100% - 64px); border:0; background:#fff; }
  #scanner .stage { position:relative; height:calc(100% - 140px); background:#000; }
  #scanner video, #scanner canvas { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; }
  #scanTip { text-align:center; padding:8px; color:var(--muted); }
  #scanner footer { padding:0 8px; }
</style>
</head>
<body>
<main>
  <h1>PokéPreço</h1>
  <button onclick="openScanner()">📷 Escanear carta</button>
  <button class="sec" onclick="$('cam').click()">🖼️ Enviar foto</button>
  <input id="cam" type="file" accept="image/*" hidden>
  <input id="q" type="text" placeholder="ou digite: Pikachu 25/165" style="margin-top:12px">
  <button class="sec" onclick="search($('q').value)">Buscar</button>
  <div id="status"></div>
  <img id="shot" hidden alt="Carta capturada">
  <pre id="debug"></pre>
  <div id="results"></div>
</main>

<dialog id="scanner">
  <header><button class="sec" onclick="closeScanner()">✕ Fechar</button></header>
  <div class="stage">
    <video id="video" playsinline muted></video>
    <canvas id="overlay"></canvas>
  </div>
  <div id="scanTip">Carregando detector…</div>
  <footer><button onclick="capture(true)">Capturar agora</button></footer>
</dialog>

<dialog id="liga">
  <header>
    <button class="sec" onclick="liga.close()">✕ Fechar</button>
    <button id="ligaOut">Abrir fora ↗</button>
  </header>
  <iframe id="ligaFrame"></iframe>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script async src="https://cdn.jsdelivr.net/npm/@techstark/opencv-js@4.10.0-release.1/dist/opencv.js" onload="cvLoaded()"></script>
<script>
const $ = id => document.getElementById(id);
const status = t => $('status').textContent = t;
let brlUsd = null, brlEur = null;

fetch('https://open.er-api.com/v6/latest/BRL').then(r => r.json())
  .then(d => { brlUsd = 1 / d.rates.USD; brlEur = 1 / d.rates.EUR; }).catch(() => {});

// ---------- OpenCV readiness ----------
let cvReady;
const cvPromise = new Promise(r => cvReady = r);
async function cvLoaded() {
  if (cv instanceof Promise) cv = await cv;
  if (!cv.Mat) await new Promise(r => cv.onRuntimeInitialized = r);
  cvReady();
}

// ---------- live scanner ----------
const W = 630, H = 880;           // card is 63x88 mm
const STABLE_FRAMES = 6;          // calibration knob: frames the card must hold still
let stream, timer, lastQuad, stable = 0, busy = false;

async function openScanner() {
  $('scanner').showModal();
  $('scanTip').textContent = 'Abrindo câmera…';
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: { ideal: 3840 }, height: { ideal: 2160 } }, audio: false });
  } catch (err) {
    $('scanTip').textContent = 'Sem acesso à câmera: ' + err.message;
    return;
  }
  const v = $('video');
  v.srcObject = stream;
  await v.play();
  $('scanTip').textContent = 'Carregando detector…';
  await cvPromise;
  $('scanTip').textContent = 'Aponte para a carta, sobre um fundo liso';
  stable = 0; lastQuad = null; busy = false;
  timer = setInterval(detectFrame, 120);
}

function closeScanner() {
  clearInterval(timer);
  stream?.getTracks().forEach(t => t.stop());
  $('scanner').close();
}

// small working copy of the video frame for detection
const small = document.createElement('canvas');

function detectFrame() {
  const v = $('video');
  if (busy || !v.videoWidth) return;
  const s = 480 / v.videoWidth;
  small.width = 480; small.height = Math.round(v.videoHeight * s);
  small.getContext('2d').drawImage(v, 0, 0, small.width, small.height);
  const quad = findCard(small);
  drawOverlay(quad && quad.map(p => ({ x: p.x / s, y: p.y / s })));
  if (!quad) { stable = 0; lastQuad = null; return; }
  const moved = lastQuad ? Math.max(...quad.map((p, i) => Math.hypot(p.x - lastQuad[i].x, p.y - lastQuad[i].y))) : 99;
  stable = moved < 6 ? stable + 1 : 0;
  lastQuad = quad;
  $('scanTip').textContent = stable ? `Segure firme… ${Math.min(100, Math.round(stable / STABLE_FRAMES * 100))}%` : 'Carta detectada';
  if (stable >= STABLE_FRAMES) capture(false);
}

// returns 4 corners [tl,tr,br,bl] in `canvas` coords, or null
function findCard(canvas) {
  const src = cv.imread(canvas), gray = new cv.Mat(), edges = new cv.Mat();
  const contours = new cv.MatVector(), hier = new cv.Mat();
  let best = null, bestArea = canvas.width * canvas.height * 0.12;   // card must fill >12% of frame
  try {
    cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
    cv.GaussianBlur(gray, gray, new cv.Size(5, 5), 0);
    cv.Canny(gray, edges, 40, 120);
    cv.dilate(edges, edges, cv.Mat.ones(3, 3, cv.CV_8U));
    cv.findContours(edges, contours, hier, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);
    for (let i = 0; i < contours.size(); i++) {
      const c = contours.get(i), approx = new cv.Mat();
      cv.approxPolyDP(c, approx, 0.03 * cv.arcLength(c, true), true);
      const area = cv.contourArea(approx);
      if (approx.rows === 4 && area > bestArea && cv.isContourConvex(approx)) {
        const pts = order([0, 1, 2, 3].map(k => ({ x: approx.data32S[k * 2], y: approx.data32S[k * 2 + 1] })));
        const w = (dist(pts[0], pts[1]) + dist(pts[3], pts[2])) / 2;
        const h = (dist(pts[0], pts[3]) + dist(pts[1], pts[2])) / 2;
        const ratio = Math.min(w, h) / Math.max(w, h);       // real card ≈ 0.716
        if (ratio > 0.6 && ratio < 0.83) { best = pts; bestArea = area; }
      }
      approx.delete(); c.delete();
    }
  } finally { src.delete(); gray.delete(); edges.delete(); contours.delete(); hier.delete(); }
  return best;
}

const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
function order(p) {
  const sum = q => q.x + q.y, diff = q => q.y - q.x;
  const by = f => [...p].sort((a, b) => f(a) - f(b));
  return [by(sum)[0], by(diff)[0], by(sum)[3], by(diff)[3]];   // tl, tr, br, bl
}

function drawOverlay(quad) {
  const v = $('video'), o = $('overlay');
  o.width = v.videoWidth; o.height = v.videoHeight;
  const g = o.getContext('2d');
  g.clearRect(0, 0, o.width, o.height);
  if (!quad) return;
  g.lineWidth = 8; g.strokeStyle = stable ? '#3ddc84' : '#ffcb05';
  g.beginPath(); quad.forEach((p, i) => i ? g.lineTo(p.x, p.y) : g.moveTo(p.x, p.y)); g.closePath(); g.stroke();
}

// warp the card out of the full-res frame; manual = use whole frame if nothing detected
async function capture(manual) {
  if (busy) return;
  busy = true;
  const v = $('video');
  const full = document.createElement('canvas');
  full.width = v.videoWidth; full.height = v.videoHeight;
  full.getContext('2d').drawImage(v, 0, 0);
  let out = full;
  if (lastQuad) {
    const s = v.videoWidth / 480;
    let q = lastQuad.map(p => ({ x: p.x * s, y: p.y * s }));
    if (dist(q[0], q[1]) > dist(q[0], q[3])) q = [q[3], q[0], q[1], q[2]];  // landscape → rotate to portrait
    const h = Math.max(H, dist(q[0], q[3]), dist(q[1], q[2]));              // keep native resolution
    out = warp(full, q, Math.round(h * W / H), Math.round(h));
  } else if (!manual) { busy = false; return; }
  closeScanner();
  readCard(out);
}

function warp(canvas, q, w = W, h = H) {
  const src = cv.imread(canvas), dst = new cv.Mat();
  const from = cv.matFromArray(4, 1, cv.CV_32FC2, q.flatMap(p => [p.x, p.y]));
  const to = cv.matFromArray(4, 1, cv.CV_32FC2, [0, 0, w, 0, w, h, 0, h]);
  const M = cv.getPerspectiveTransform(from, to);
  cv.warpPerspective(src, dst, M, new cv.Size(w, h), cv.INTER_CUBIC);
  const out = document.createElement('canvas');
  cv.imshow(out, dst);
  [src, dst, from, to, M].forEach(m => m.delete());
  return out;
}

// ---------- OCR ----------
let workerP;
async function readCard(img) {
  $('shot').src = (img.toDataURL ? img : toCanvas(img)).toDataURL('image/jpeg', 0.8);
  $('shot').hidden = false;
  status('Lendo a carta… (a 1ª vez demora)');
  try {
    workerP ??= Tesseract.createWorker('eng');
    const worker = await workerP;
    // try upright, then upside-down (card held the other way)
    let r = await ocrPass(worker, img);
    if (!r.num && !r.name) r = await ocrPass(worker, rotate180(img));
    const { name, num, top, bottom } = r;
    const q = [name, num && `${+num[1]}/${num[2]}`].filter(Boolean).join(' ');
    $('q').value = q;
    $('debug').textContent = `Imagem: ${img.width}×${img.height}\nTopo: ${top.trim() || '—'}\nRodapé: ${bottom.trim() || '—'}`;
    q ? search(q) : status('Não consegui ler. Digite o nome/número.');
  } catch (err) { status('Erro no OCR: ' + err.message); }
}

async function ocrPass(worker, img) {
  // number: digits-only, sparse text — the collector number is tiny and sits in a corner
  await worker.setParameters({ tessedit_char_whitelist: '0123456789/', tessedit_pageseg_mode: '11' });
  const bottom = (await worker.recognize(band(img, 0.88, 1, 2400))).data.text;
  await worker.setParameters({ tessedit_char_whitelist: '', tessedit_pageseg_mode: '6' });
  const top = (await worker.recognize(band(img, 0.02, 0.12))).data.text;
  const num = bottom.replace(/\s+/g, ' ').match(/(\d{1,3}) ?\/ ?(\d{2,3})/);
  const skip = /^(basic|stage|basico|básico|estágio|estagio|evolves|evolui|trainer|item|pokémon|pokemon)$/i;
  const name = (top.match(/[A-ZÀ-Ú][A-Za-zÀ-ú'.-]{2,}/g) || []).find(w => !skip.test(w)) || '';
  return { name, num, top, bottom };
}

function rotate180(img) {
  const c = document.createElement('canvas');
  c.width = img.width; c.height = img.height;
  const g = c.getContext('2d');
  g.translate(c.width, c.height); g.rotate(Math.PI);
  g.drawImage(img, 0, 0);
  return c;
}

function toCanvas(img) {
  const c = document.createElement('canvas');
  c.width = img.width; c.height = img.height;
  c.getContext('2d').drawImage(img, 0, 0);
  return c;
}

// crop a horizontal band (fractions of height), upscale, grayscale + contrast
function band(img, y0, y1, targetW = 1600) {
  const sh = img.height * (y1 - y0), scale = Math.max(1, targetW / img.width);
  const c = document.createElement('canvas');
  c.width = img.width * scale; c.height = sh * scale;
  const g = c.getContext('2d');
  g.filter = 'grayscale(1) contrast(1.8)';
  g.drawImage(img, 0, img.height * y0, img.width, sh, 0, 0, c.width, c.height);
  return c;
}

$('cam').onchange = async e => {
  const file = e.target.files[0];
  if (!file) return;
  readCard(await createImageBitmap(file, { imageOrientation: 'from-image' }));
  e.target.value = '';
};

// ---------- price search ----------
async function search(text) {
  text = text.trim();
  if (!text) return;
  const num = text.match(/(\d+)\s*\/\s*(\d+)/);
  const name = text.replace(/\d+\s*\/\s*\d+/, '').trim();
  if (!name && !num) return status('Digite o nome da carta.');
  status('Buscando…');
  $('results').innerHTML = '';
  const API = 'https://api.tcgdex.net/v2/en/cards';
  try {
    if (num) {
      const byNum = await findByNumber(+num[1], +num[2], name);
      if (byNum.length) {
        status(`${byNum.length} resultado(s) pelo número`);
        return byNum.forEach(render);
      }
    }
    if (!name) return status('Nada encontrado para esse número.');
    const qs = new URLSearchParams();
    if (name) qs.set('name', name);
    let list = await (await fetch(`${API}?${qs}`)).json();
    // drop TCG Pocket (digital) cards, match collector number client-side (API keeps leading zeros)
    list = list.filter(c => c.image && !/^(A\d|P-A)/.test(c.id) && (!num || +c.localId === +num[1]));
    // ponytail: detail fetch per card (pricing only on detail); capped at 12
    let cards = await Promise.all(list.slice(-12).reverse().map(c => fetch(`${API}/${c.id}`).then(r => r.json())));
    const exact = num && cards.filter(c => c.set.cardCount?.official === +num[2]);
    if (exact?.length) cards = exact;
    status(cards.length ? `${cards.length} resultado(s)` : 'Nada encontrado.');
    cards.forEach(render);
  } catch { status('Erro na busca. Tente de novo.'); }
}

// "136/189": every physical set whose printed total is 189, then card 136 in each
let setsP;
async function findByNumber(n, total, name) {
  setsP ??= fetch('https://api.tcgdex.net/v2/en/sets').then(r => r.json());
  const sets = (await setsP).filter(s => s.cardCount?.official === total && !/^(A\d|P-A)/.test(s.id));
  const cards = (await Promise.all(sets.map(s =>
    fetch(`https://api.tcgdex.net/v2/en/sets/${s.id}/${n}`).then(r => r.ok ? r.json() : null).catch(() => null)
  ))).filter(Boolean);
  const named = name && cards.filter(c => c.name.toLowerCase().includes(name.toLowerCase()));
  return named?.length ? named : cards;
}

const brl = (v, rate) => v && rate ? ` ≈ R$ ${(v * rate).toFixed(2)}` : '';

function render(c) {
  const p = c.pricing || {};
  const tcg = Object.entries(p.tcgplayer || {}).filter(([, v]) => typeof v === 'object')
    .map(([k, v]) => `<div class="price">TCGplayer ${k}: <b>US$ ${v.marketPrice ?? v.midPrice ?? '-'}</b>${brl(v.marketPrice ?? v.midPrice, brlUsd)}</div>`).join('');
  const cm = p.cardmarket?.trend;
  const el = document.createElement('div');
  el.className = 'res';
  el.innerHTML = `<img src="${c.image}/low.webp" alt="${c.name}">
    <div><strong>${c.name}</strong><br><small>${c.set.name} · ${c.localId}/${c.set.cardCount?.official ?? '?'}</small>
    ${tcg}${cm ? `<div class="price">Cardmarket: <b>€ ${cm}</b>${brl(cm, brlEur)}</div>` : ''}
    <button>Ver na Liga</button></div>`;
  el.querySelector('button').onclick = () => openLiga(c.name);
  $('results').append(el);
}

function openLiga(name) {
  const url = 'https://www.ligapokemon.com.br/?view=cards/search&card=' + encodeURIComponent(name);
  $('ligaFrame').src = url;
  $('ligaOut').onclick = () => window.open(url, '_blank');
  $('liga').showModal();
}
</script>
</body>
</html>
